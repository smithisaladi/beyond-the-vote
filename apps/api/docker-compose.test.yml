# Local Postgres for integration tests. CI uses a service container instead.
# Start: docker compose -f docker-compose.test.yml up -d
services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"   # host 5433 to avoid clashing with a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15
