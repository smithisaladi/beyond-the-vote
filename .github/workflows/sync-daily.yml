name: Daily Sync — Bills + Votes + Embeddings

on:
  schedule:
    - cron: "0 6 * * 1-5"  # 6am UTC, weekdays
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Restore usc-run cache
        uses: actions/cache@v4
        with:
          path: |
            pipeline/data/congress-scraper
          key: usc-run-data-${{ github.run_id }}
          restore-keys: |
            usc-run-data-

      - name: Run daily sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m scripts.sync_daily
