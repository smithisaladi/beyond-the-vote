name: Daily Sync — Bills + Votes + Embeddings

on:
  schedule:
    - cron: "0 6 * * 1-5"  # 6am UTC, weekdays
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Must exceed the sum of sync_daily's subprocess timeouts (govinfo 90m +
    # bills 10m + votes 30m = 130m) plus checkout/uv-sync overhead, so a cold
    # cache seed can complete in one pass rather than being killed mid-run.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      # Restore + save are split (instead of the combined actions/cache) so the
      # cache is written even when the job fails. The govinfo download can time
      # out on a cold cache; saving its partial progress lets the next run resume
      # and converge, instead of re-downloading everything from scratch forever.
      - name: Restore usc-run cache
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/data/congress-scraper
          key: usc-run-data-${{ github.run_id }}
          restore-keys: |
            usc-run-data-

      - name: Run daily sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python -m scripts.sync_daily

      - name: Save usc-run cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/data/congress-scraper
          key: usc-run-data-${{ github.run_id }}
