[project]
name = "btb-pipeline"
version = "0.1.0"
description = "ETL pipeline for Beyond the Ballot (FEC, Congress.gov, VoteView -> Supabase)."
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "responses>=0.25.0",
]

[tool.uv]
# Pipeline is a collection of scripts, not an installable library.
package = false
