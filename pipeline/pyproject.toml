[project]
name = "beyond-the-ballot-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0.0",
    "httpx>=0.28.0",
    "duckdb>=1.0.0",
    "pyarrow>=18.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "sentry-sdk>=2.19.0",
    "sentence-transformers>=3.4.0",
    "usaddress>=0.5.10",
    "hdbscan>=0.8.39",
    "scikit-learn>=1.6.0",
    "umap-learn>=0.5.7",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "transform", "scripts", "ingest", "load", "enrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]
